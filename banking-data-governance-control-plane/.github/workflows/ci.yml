name: Governance Control CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: make demo
      - run: make test
      - name: Verify expected negative-control decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('data/output/governance_summary.json').read_text())
          assert result['certification_status'] == 'NON_COMPLIANT'
          assert result['violations']['total'] == 11
          PY

